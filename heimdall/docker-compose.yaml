services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:2.8.4@sha256:a2ab22230f93ef416cdd92713470b17a615fa771a834848193a6332c6b311dce
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /opt/stacks/heimdall:/config
    ports:
      - "${HEIMDALL_BIND_IP:-127.0.0.1}:80:80"
    restart: unless-stopped
