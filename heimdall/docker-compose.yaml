services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:2.8.4@sha256:51693bcb3a46e619592a4f7aad65d6610f8bda80c3b167d03254a96a944e8aed
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /opt/stacks/heimdall:/config
    ports:
      - "${HEIMDALL_BIND_IP:-127.0.0.1}:80:80"
    restart: unless-stopped
