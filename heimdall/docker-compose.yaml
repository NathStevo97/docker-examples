services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:2.8.4@sha256:47f70751f900be4499017a48c01206c02ab9d18f34a580c6213a13d24cdc1a4a
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
    volumes:
      - /opt/stacks/heimdall:/config
    ports:
      - "${HEIMDALL_BIND_IP:-127.0.0.1}:80:80"
    restart: unless-stopped
